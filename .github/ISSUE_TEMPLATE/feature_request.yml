name: Feature request
description: Suggest a capability for the on-device IDE
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        CodePrimer tracks CodeAssist closely. If a feature belongs to the IDE as such rather than to this
        remix, it is better proposed [upstream](https://github.com/tyron12233/CodeAssist/issues) where it
        benefits both projects — it can still land here after a merge. Say which you think it is.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do on the device that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you expect, and where in the UI it would live.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Where does it belong?
      options:
        - Upstream CodeAssist (the IDE itself)
        - CodePrimer remix (identity, release pipeline, distribution)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other apps, plugins, or a plugin you could write against the plugin SPI instead.
    validations:
      required: false
